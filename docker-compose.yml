
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: myshop-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4000"
    networks:
      - myshop-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: myshop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - myshop-net

networks:
  myshop-net:
    driver: bridge
